<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoApply - Neumorphism</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #e0e5ec; --text: #4d5969; --primary: #3b82f6; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 3rem; }
        
        .neu-card {
            background: var(--bg);
            border-radius: 20px;
            box-shadow: 9px 9px 16px rgb(163,177,198,0.6), -9px -9px 16px rgba(255,255,255, 0.5);
            padding: 2.5rem;
        }
        .neu-pressed {
            background: var(--bg);
            border-radius: 12px;
            box-shadow: inset 6px 6px 10px 0 rgba(163,177,198, 0.7), inset -6px -6px 10px 0 rgba(255,255,255, 0.8);
        }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3rem; }
        .logo { font-size: 2rem; font-weight: 700; color: var(--primary); }
        .nav-btn {
            padding: 1rem 2rem; border-radius: 12px; font-weight: 500; color: var(--text);
            background: var(--bg); border: none; cursor: pointer;
            box-shadow: 6px 6px 10px rgba(163,177,198, 0.6), -6px -6px 10px rgba(255,255,255, 0.5);
            transition: all 0.2s ease;
        }
        .nav-btn:hover { box-shadow: 4px 4px 6px rgba(163,177,198, 0.6), -4px -4px 6px rgba(255,255,255, 0.5); }
        .nav-btn:active { box-shadow: inset 4px 4px 6px rgba(163,177,198, 0.6), inset -4px -4px 6px rgba(255,255,255, 0.5); }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; max-width: 1200px; margin: 0 auto; }
        
        h2 { font-size: 1.8rem; margin-bottom: 1rem; color: #2d3748; }
        
        .form-group { margin-bottom: 2rem; }
        label { display: block; margin-bottom: 0.8rem; font-weight: 500; }
        input, textarea {
            width: 100%; border: none; padding: 1.2rem; color: var(--text); font-size: 1rem; outline: none;
        }
        textarea { resize: vertical; height: 180px; }
        
        .btn-submit {
            width: 100%; padding: 1.2rem; border: none; border-radius: 12px;
            background: var(--primary); color: white; font-weight: 700; font-size: 1.1rem;
            cursor: pointer; box-shadow: 6px 6px 12px rgba(59, 130, 246, 0.3), -6px -6px 12px rgba(255,255,255, 0.5);
            transition: all 0.2s;
        }
        .btn-submit:active { box-shadow: inset 4px 4px 8px rgba(37, 99, 235, 0.5); }
        
        .history-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; padding: 1.5rem; }
        .history-item h4 { color: #2d3748; }
    </style>
</head>
<body>
    <header>
        <div class="logo">AutoApply</div>
        <div style="display: flex; gap: 1.5rem;">
            <button class="nav-btn">Resume Builder</button>
            <button class="nav-btn">Campaigns</button>
        </div>
    </header>
    
    <div class="grid">
        <div class="neu-card">
            <h2>AI Resume Tailor</h2>
            <div class="form-group">
                <label>Company Name</label>
                <div class="neu-pressed">
                    <input type="text" style="background: transparent;" placeholder="Google">
                </div>
            </div>
            <div class="form-group">
                <label>Job Description</label>
                <div class="neu-pressed">
                    <textarea style="background: transparent;" placeholder="Paste JD..."></textarea>
                </div>
            </div>
            <button class="btn-submit">Tailor Resume</button>
        </div>
        
        <div class="neu-card">
            <h2>Generated Resumes</h2>
            <br>
            <div class="neu-card history-item" style="padding: 1.5rem;">
                <div>
                    <h4>Google - Software Engineer</h4>
                    <small>Today</small>
                </div>
                <button class="nav-btn" style="padding: 0.8rem 1.5rem;">Download</button>
            </div>
            <div class="neu-card history-item" style="padding: 1.5rem;">
                <div>
                    <h4>Microsoft - Cloud Architect</h4>
                    <small>Yesterday</small>
                </div>
                <button class="nav-btn" style="padding: 0.8rem 1.5rem;">Download</button>
            </div>
        </div>
    </div>
</body>
</html>

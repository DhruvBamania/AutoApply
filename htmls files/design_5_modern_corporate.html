<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoApply - Modern Corporate</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0F172A; --accent: #2563EB; --bg: #F8FAFC; --card: #FFFFFF; --border: #E2E8F0; --text: #334155; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }
        
        .sidebar { width: 280px; background: var(--card); border-right: 1px solid var(--border); padding: 2rem; display: flex; flex-direction: column; }
        .logo { font-size: 1.5rem; font-weight: 700; color: var(--primary); margin-bottom: 3rem; display: flex; align-items: center; gap: 0.5rem; }
        .nav-menu { display: flex; flex-direction: column; gap: 0.5rem; }
        .nav-link { padding: 0.8rem 1rem; text-decoration: none; color: var(--text); font-weight: 500; border-radius: 8px; transition: 0.2s; }
        .nav-link:hover, .nav-link.active { background: #EFF6FF; color: var(--accent); }
        
        .main-content { flex: 1; padding: 3rem 4rem; overflow-y: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        h1 { color: var(--primary); font-size: 2rem; }
        
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 2rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        
        .form-grid { display: grid; gap: 1.5rem; }
        label { font-size: 0.875rem; font-weight: 600; color: var(--primary); margin-bottom: 0.5rem; display: block; }
        input, textarea { width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; transition: 0.2s; outline: none; }
        input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        
        .btn-primary { background: var(--primary); color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-primary:hover { background: #1E293B; }
        
        .table-container { margin-top: 3rem; }
        table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
        th, td { padding: 1rem 1.5rem; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: #F1F5F9; font-weight: 600; color: var(--primary); font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .btn-sm { padding: 0.4rem 0.8rem; background: #EFF6FF; color: var(--accent); border: none; border-radius: 6px; font-weight: 500; cursor: pointer; }
        .btn-sm:hover { background: #DBEAFE; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            AutoApply
        </div>
        <div class="nav-menu">
            <a href="#" class="nav-link active">Resume Builder</a>
            <a href="#" class="nav-link">Social Campaign</a>
            <a href="#" class="nav-link">Integrations</a>
            <a href="#" class="nav-link">Settings</a>
        </div>
    </div>
    
    <div class="main-content">
        <div class="header">
            <h1>Tailor Your Resume</h1>
            <button class="btn-primary">Upload Base Resume</button>
        </div>
        
        <div class="card">
            <div class="form-grid">
                <div>
                    <label>Target Company</label>
                    <input type="text" placeholder="Enter company name">
                </div>
                <div>
                    <label>Job Description</label>
                    <textarea rows="5" placeholder="Paste the job requirements here to optimize your resume ATS score..."></textarea>
                </div>
                <div style="display: flex; justify-content: flex-end;">
                    <button class="btn-primary" style="background: var(--accent);">Generate ATS Resume</button>
                </div>
            </div>
        </div>
        
        <div class="table-container">
            <h2 style="font-size: 1.25rem; color: var(--primary); margin-bottom: 1rem;">Document History</h2>
            <table>
                <thead>
                    <tr>
                        <th>Company</th>
                        <th>Date Generated</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td style="font-weight: 500;">Google</td>
                        <td>Sep 30, 2026</td>
                        <td><span style="background: #DCFCE7; color: #166534; padding: 0.2rem 0.6rem; border-radius: 99px; font-size: 0.8rem; font-weight: 600;">Optimized</span></td>
                        <td><button class="btn-sm">Download .docx</button></td>
                    </tr>
                    <tr>
                        <td style="font-weight: 500;">Amazon</td>
                        <td>Sep 28, 2026</td>
                        <td><span style="background: #DCFCE7; color: #166534; padding: 0.2rem 0.6rem; border-radius: 99px; font-size: 0.8rem; font-weight: 600;">Optimized</span></td>
                        <td><button class="btn-sm">Download .docx</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
